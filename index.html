    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/index.umd.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #B39D82;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .dialog-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .dialog-card {
            background: #FAF6F0;
            border: 2px solid #D3C3A8;
            border-radius: 27px;
            padding: 30px 25px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .dialog-title {
            font-size: 22px;
            font-weight: bold;
            color: #3D3228;
            margin-bottom: 20px;
        }
        .dialog-text {
            font-size: 16px;
            color: #5C4A3E;
            margin-bottom: 20px;
            white-space: pre-line;
            line-height: 1.4;
        }
        .dialog-btn {
            background: #EADECB;
            border: 1px solid #C4B396;
            border-radius: 16px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #3D3228;
            margin: 8px 0;
            cursor: pointer;
            width: 100%;
            display: block;
        }
        .dialog-btn:active {
            background: #D9CBB6;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(61, 50, 40, 0.9);
            color: #FFF;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2000;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>

const supportedLangs = ["ru", "en", "es", "pt", "fr", "de"];

// Глобальные переменные статистики
let globalStats = {
    total_time: 0,
    total_moves: 0,
    best_time: 0
};

function loadLocalStats() {
    globalStats.total_time = parseInt(localStorage.getItem("total_time") || "0");
    globalStats.total_moves = parseInt(localStorage.getItem("total_moves") || "0");
    globalStats.best_time = parseInt(localStorage.getItem("best_time") || "0");
}

// Защищенная инициализация VK Bridge
if (window.vkBridge) {
    vkBridge.send('VKWebAppInit')
        .then(() => {
            return vkBridge.send('VKWebAppStorageGet', {
                keys: ['total_time', 'total_moves', 'best_time']
            });
        })
        .then(data => {
            if (data && data.keys) {
                data.keys.forEach(item => {
                    if (item.key === 'total_time') globalStats.total_time = parseInt(item.value || '0');
                    if (item.key === 'total_moves') globalStats.total_moves = parseInt(item.value || '0');
                    if (item.key === 'best_time') globalStats.best_time = parseInt(item.value || '0');
                });
            }
        })
        .catch(() => {
            loadLocalStats();
        });
} else {
    loadLocalStats();
}

// Функция сохранения в облако VK и локально
function saveGameCloudStats(sessionTimeInc, movesInc) {
    globalStats.total_time += sessionTimeInc;
    globalStats.total_moves += movesInc;

    localStorage.setItem("total_time", globalStats.total_time.toString());
    localStorage.setItem("total_moves", globalStats.total_moves.toString());
    localStorage.setItem("best_time", globalStats.best_time.toString());

    if (window.vkBridge) {
        vkBridge.send('VKWebAppStorageSet', { key: 'total_time', value: globalStats.total_time.toString() }).catch(() => {});
        vkBridge.send('VKWebAppStorageSet', { key: 'total_moves', value: globalStats.total_moves.toString() }).catch(() => {});
        vkBridge.send('VKWebAppStorageSet', { key: 'best_time', value: globalStats.best_time.toString() }).catch(() => {});
    }
}

// Отправка рекорда времени в Лидерборд ВКонтакте
function submitScoreToLeaderboard(timeInMs) {
    if (window.vkBridge) {
        vkBridge.send('VKWebAppLeaderboardSetScore', {
            score: Math.floor(timeInMs)
        }).catch(err => {
            console.log('Ошибка сохранения рекорда в VK:', err);
        });
    }
}

// Показ межстраничной рекламы VK
function triggerAd(callback) {
    if (isMusicEnabled) bgMusic.pause();

    if (window.vkBridge) {
        vkBridge.send('VKWebAppShowNativeAds', { ad_format: 'interstitial' })
            .then((data) => {
                if (isMusicEnabled) bgMusic.play().catch(() => {});
                if (callback) callback();
            })
            .catch((error) => {
                if (isMusicEnabled) bgMusic.play().catch(() => {});
                if (callback) callback();
            });
    } else {
        if (callback) callback();
    }
}

// Управление фоновой музыкой
const bgMusic = document.getElementById('bgMusic');
let isMusicEnabled = localStorage.getItem("game_music") !== "false";
let musicStarted = false;

function startMusicOnFirstTouch() {
    if (!musicStarted && isMusicEnabled) {
        bgMusic.play().then(() => {
            musicStarted = true;
        }).catch(() => {});
    }
}

window.addEventListener('pointerdown', startMusicOnFirstTouch, { once: true });

function toggleMusic() {
    isMusicEnabled = !isMusicEnabled;
    localStorage.setItem("game_music", isMusicEnabled.toString());
    if (isMusicEnabled) {
        bgMusic.play().catch(() => {});
        musicStarted = true;
    } else {
        bgMusic.pause();
    }
    showSettingsDialog();
}

function t(key) {
    return translations[currentLang][key] || key;
}

function toggleLanguage() {
    let idx = supportedLangs.indexOf(currentLang);
    currentLang = supportedLangs[(idx + 1) % supportedLangs.length];
    localStorage.setItem("game_lang", currentLang);
    showSettingsDialog();
}

class Cubie {
    constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.colors = new Array(6).fill(0);
        this.colors[0] = (z === 0) ? "#2979FF" : 0;
        this.colors[1] = (z === 2) ? "#00E676" : 0;
        this.colors[2] = (x === 0) ? "#FF6B00" : 0;
        this.colors[3] = (x === 2) ? "#EE2C38" : 0;
        this.colors[4] = (y === 0) ? "#FFFFFF" : 0;
        this.colors[5] = (y === 2) ? "#FFD600" : 0;
    }
}

class FaceToDraw {
    constructor(p, p3d, z, c, type, cubie) {
        this.pts = p.map(pt => [...pt]);
        this.raw3DPts = p3d.map(pt => [...pt]);
        this.avgZ = z;
        this.color = c;
        this.faceType = type;
        this.cubie = cubie;
    }
}

class Move {
    constructor(a, l, cw) {
        this.axis = a;
        this.layer = l;
        this.clockwise = cw;
    }
}

class CubeGame {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        
        this.cube = Array.from({length: 3}, () => 
            Array.from({length: 3}, () => new Array(3))
        );

        this.sessionStartTime = Date.now();
        this.sessionMoveCount = 0;

        this.isTimedMode = false;
        this.isScrambling = false;
        this.showCountdownText = false;
        this.countdownString = "";
        this.countdownAlpha = 0;

        this.showSplash = true;
        this.splashAlpha = 1.0;

        this.solveStartTime = 0;
        this.finalSolveTime = 0;

        this.camX = -30;
        this.camY = 45;
        this.zoomScale = 1.0;
        this.downX = 0;
        this.downY = 0;

        this.touchedFace = null;
        this.isLayerSwipe = false;
        this.currentFacesList = [];

        this.animating = false;
        this.isDraggingLayer = false;
        this.animAngle = 0;
        this.animAxis = -1;
        this.animLayer = -1;
        this.animClockwise = true;

        this.swipeDirX = 0;
        this.swipeDirY = 0;
        this.isSolved = true;

        this.historyMoves = [];
        this.sequenceQueue = [];

        this.init();
    }

    init() {
        this.createCube();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.setupEvents();
        this.startSplashAnimation();
        requestAnimationFrame(() => this.loop());
    }

    resize() {
        this.canvas.width = window.innerWidth * window.devicePixelRatio;
        this.canvas.height = window.innerHeight * window.devicePixelRatio;
    }

    getUIScale() {
        return Math.min(this.canvas.width, this.canvas.height) / 600;
    }

    createCube() {
        for (let x = 0; x < 3; x++)
            for (let y = 0; y < 3; y++)
                for (let z = 0; z < 3; z++)
                    this.cube[x][y][z] = new Cubie(x, y, z);
        this.isSolved = true;
        this.historyMoves = [];
    }

    startSplashAnimation() {
        setTimeout(() => {
            let start = null;
            const animate = (timestamp) => {
                if (!start) start = timestamp;
                let progress = (timestamp - start) / 800;
                if (progress < 1) {
                    this.splashAlpha = 1.0 - progress;
                    requestAnimationFrame(animate);
                } else {
                    this.splashAlpha = 0;
                    this.showSplash = false;
                }
            };
            requestAnimationFrame(animate);
        }, 2500);
    }

    checkSolved() {
        if (this.sequenceQueue.length > 0 || this.animating || this.isDraggingLayer) {
            return false;
        }

        let z0Color = this.cube[0][0][0].colors[0];
        let z2Color = this.cube[0][0][2].colors[1];
        let x0Color = this.cube[0][0][0].colors[2];
        let x2Color = this.cube[2][0][0].colors[3];
        let y0Color = this.cube[0][0][0].colors[4];
        let y2Color = this.cube[0][2][0].colors[5];

        for (let x = 0; x < 3; x++) {
            for (let y = 0; y < 3; y++) {
                for (let z = 0; z < 3; z++) {
                    let c = this.cube[x][y][z];
                    if (z === 0 && c.colors[0] !== z0Color) return false;
                    if (z === 2 && c.colors[1] !== z2Color) return false;
                    if (x === 0 && c.colors[2] !== x0Color) return false;
                    if (x === 2 && c.colors[3] !== x2Color) return false;
                    if (y === 0 && c.colors[4] !== y0Color) return false;
                    if (y === 2 && c.colors[5] !== y2Color) return false;
                }
            }
        }
        return true;
    }

    getFormattedTime(elapsedMillis) {
        let seconds = Math.floor(elapsedMillis / 1000) % 60;
        let minutes = Math.floor(elapsedMillis / (1000 * 60)) % 60;
        let hours = Math.floor(elapsedMillis / (1000 * 60 * 60));
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    getFormattedPreciseTime(elapsedMillis) {
        let millis = elapsedMillis % 1000;
        let seconds = Math.floor(elapsedMillis / 1000) % 60;
        let minutes = Math.floor(elapsedMillis / (1000 * 60)) % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
    }

    loop() {
        this.render();
        requestAnimationFrame(() => this.loop()
